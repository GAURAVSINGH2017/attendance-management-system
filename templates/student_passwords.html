{% extends 'base.html' %}

{% block title %}Student Passwords{% endblock %}
{% block heading %}Student Passwords{% endblock %}

{% block content %}
<div class="panel edit-panel">
    <h2>Set Student Password</h2>

    <p class="muted">
        Set a new password for a student. The student will be required
        to change it after their next login.
    </p>

    <form method="post" class="form-grid">

        <label class="wide">
            Select Student *
            <select name="student_id" required>
                <option value="">Choose student</option>

                {% for s in students %}
                    {% if s.username %}
                    <option value="{{ s.id }}">
                        {{ s.full_name }} -
                        Roll {{ s.roll_no }} -
                        Class {{ s.class_name }}
                        {% if s.section %} {{ s.section }}{% endif %}
                    </option>
                    {% endif %}
                {% endfor %}
            </select>
        </label>

        <label>
            New Password *
            <input
                type="password"
                name="new_password"
                minlength="8"
                required
                autocomplete="new-password"
            >
        </label>

        <label>
            Confirm Password *
            <input
                type="password"
                name="confirm_password"
                minlength="8"
                required
                autocomplete="new-password"
            >
        </label>

        <div class="form-actions wide">
            <button class="button primary" type="submit">
                Update Password
            </button>
        </div>

    </form>
</div>
{% endblock %}

{% extends 'base.html' %}{% block heading %}Edit student{% endblock %}{% block content %}<div class="welcome-row"><div><h2>Update student details</h2><p class="muted">Guardian contacts are used for absent and late alerts.</p></div><a href="{{ url_for('students') }}" class="button secondary">← Back to students</a></div><div class="panel edit-panel"><form method="post" class="form-grid"><label>Roll number *<input name="roll_no" required value="{{ student.roll_no }}"></label><label>Full name *<input name="full_name" required value="{{ student.full_name }}"></label><label>Class *<input name="class_name" required value="{{ student.class_name }}"></label><label>Section<input name="section" value="{{ student.section }}"></label><label class="wide">Student email<input type="email" name="email" value="{{ student.email or '' }}"></label><label>Guardian name<input name="guardian_name" value="{{ student.guardian_name or '' }}"></label><label>Guardian email<input type="email" name="guardian_email" value="{{ student.guardian_email or '' }}"></label><label class="wide">Guardian mobile number<input type="tel" name="guardian_phone" value="{{ student.guardian_phone or '' }}" placeholder="Use country code, e.g. +91…"></label><div class="form-actions wide"><a class="button secondary" href="{{ url_for('students') }}">Cancel</a><button class="button primary">Save changes</button></div></form></div>{% endblock %}

{% extends 'base.html' %}{% block heading %}Add class students{% endblock %}{% block content %}
<div class="welcome-row"><div><h2>Enter student details</h2><p class="muted">Class {{ setup.class_name }} · Section {{ setup.section }} · {{ setup.count }} students</p></div><a class="button secondary" href="{{ url_for('classes') }}">Cancel</a></div>
<div class="panel edit-panel"><form method="post" class="form-grid">{% for i in student_slots %}<div class="wide"><h3>Student {{ i+1 }}</h3></div><label>Roll number *<input name="student_{{ i }}_roll_no" maxlength="30" required></label><label>Full name *<input name="student_{{ i }}_full_name" maxlength="120" required></label><label>Date of birth *<input type="date" name="student_{{ i }}_date_of_birth" required></label><label>Student email<input type="email" name="student_{{ i }}_email"></label><label>Guardian name<input name="student_{{ i }}_guardian_name" maxlength="120"></label><label>Guardian email<input type="email" name="student_{{ i }}_guardian_email"></label>{% endfor %}<div class="form-actions wide"><button class="button primary">Save all students</button></div></form></div>
{% endblock %}
